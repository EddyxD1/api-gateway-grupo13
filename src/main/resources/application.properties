spring.application.name=api-gateway-grupo13
server.port=8070

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

spring.cloud.gateway.server.webmvc.routes[0].id=cita-service-grupo13
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://CITA-SERVICE-GRUPO13
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/v1/citas/**

spring.cloud.gateway.server.webmvc.routes[1].id=paciente-service-grupo13
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://PACIENTE-SERVICE-GRUPO13
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/v1/pacientes/**
